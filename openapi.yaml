openapi: 3.0.3
info:
  title: Aetheron-X Task API
  version: '0.1.0'
  description: |
    API for task management with authentication. All endpoints require a valid session cookie.
servers:
  - url: https://your-vercel-deployment-url
paths:
  /api/tasks:
    get:
      summary: Get all tasks for authenticated user
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  user:
                    type: string
        '401':
          description: Unauthorized
    post:
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                status:
                  type: string
                  enum: [pending, completed]
                  default: pending
                dueDate:
                  type: string
                  format: date-time
              required: [title]
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /api/tasks/{id}:
    put:
      summary: Update a task
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                status:
                  type: string
                  enum: [pending, completed]
                dueDate:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid task ID
        '401':
          description: Unauthorized
        '404':
          description: Task not found
    delete:
      summary: Delete a task
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid task ID
        '401':
          description: Unauthorized
        '404':
          description: Task not found
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [pending, completed]
        dueDate:
          type: string
          format: date-time
          nullable: true
        userId:
          type: integer
        createdAt:
          type: string
          format: date-time
